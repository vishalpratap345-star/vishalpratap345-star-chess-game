<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chess Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #555;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .status.white-turn {
            background-color: #e8f4f8;
            color: #0066cc;
        }

        .status.black-turn {
            background-color: #f0f0f0;
            color: #333;
        }

        .status.check {
            background-color: #fff3cd;
            color: #856404;
        }

        .status.checkmate {
            background-color: #f8d7da;
            color: #721c24;
        }

        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 3px solid #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .square {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            cursor: pointer;
            transition: background-color 0.2s;
            user-select: none;
        }

        .square.light {
            background-color: #f0d9b5;
        }

        .square.dark {
            background-color: #b58863;
        }

        .square.selected {
            background-color: #7fc97f !important;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .square.valid-move {
            background-color: #90ee90 !important;
        }

        .square.valid-move::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: rgba(0, 100, 0, 0.3);
            border-radius: 50%;
            position: absolute;
        }

        .square:hover {
            filter: brightness(1.1);
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #764ba2;
        }

        .move-history {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }

        .move-history h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .move-history p {
            margin: 5px 0;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>♔ Chess Game ♚</h1>
        <div class="game-info">
            <div class="status white-turn" id="status">White's Turn</div>
        </div>
        <div class="chess-board" id="board"></div>
        <div class="button-container">
            <button onclick="resetGame()">New Game</button>
        </div>
        <div class="move-history" id="moveHistory">
            <h3>Move History</h3>
        </div>
    </div>

    <script>
        // Chess piece Unicode symbols
        const pieces = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // Initial board setup
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];

        let board = JSON.parse(JSON.stringify(initialBoard));
        let selectedSquare = null;
        let currentTurn = 'white'; // 'white' or 'black'
        let moveHistory = [];

        function initBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;
                    square.onclick = () => handleSquareClick(row, col);
                    
                    const piece = board[row][col];
                    if (piece) {
                        square.textContent = pieces[piece];
                    }
                    
                    boardElement.appendChild(square);
                }
            }
        }

        function handleSquareClick(row, col) {
            const clickedPiece = board[row][col];
            
            if (selectedSquare) {
                // Try to move the selected piece
                const [selectedRow, selectedCol] = selectedSquare;
                if (isValidMove(selectedRow, selectedCol, row, col)) {
                    makeMove(selectedRow, selectedCol, row, col);
                    selectedSquare = null;
                    clearHighlights();
                    currentTurn = currentTurn === 'white' ? 'black' : 'white';
                    updateStatus();
                    initBoard();
                } else if (clickedPiece && isCurrentPlayerPiece(clickedPiece)) {
                    // Select a different piece
                    selectedSquare = [row, col];
                    highlightSquare(row, col);
                    showValidMoves(row, col);
                } else {
                    selectedSquare = null;
                    clearHighlights();
                }
            } else if (clickedPiece && isCurrentPlayerPiece(clickedPiece)) {
                // Select a piece
                selectedSquare = [row, col];
                highlightSquare(row, col);
                showValidMoves(row, col);
            }
        }

        function isCurrentPlayerPiece(piece) {
            if (currentTurn === 'white') {
                return piece === piece.toUpperCase();
            } else {
                return piece === piece.toLowerCase();
            }
        }

        function highlightSquare(row, col) {
            clearHighlights();
            const squares = document.querySelectorAll('.square');
            const index = row * 8 + col;
            squares[index].classList.add('selected');
        }

        function clearHighlights() {
            const squares = document.querySelectorAll('.square');
            squares.forEach(square => {
                square.classList.remove('selected', 'valid-move');
            });
        }

        function showValidMoves(row, col) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (isValidMove(row, col, r, c)) {
                        const squares = document.querySelectorAll('.square');
                        const index = r * 8 + c;
                        squares[index].classList.add('valid-move');
                    }
                }
            }
        }

        function isValidMove(fromRow, fromCol, toRow, toCol) {
            // Can't move to the same square
            if (fromRow === toRow && fromCol === toCol) return false;
            
            const piece = board[fromRow][fromCol];
            const targetPiece = board[toRow][toCol];
            
            // Can't capture your own pieces
            if (targetPiece && isCurrentPlayerPiece(targetPiece)) return false;
            
            const pieceType = piece.toLowerCase();
            const rowDiff = toRow - fromRow;
            const colDiff = toCol - fromCol;
            const absRowDiff = Math.abs(rowDiff);
            const absColDiff = Math.abs(colDiff);
            
            switch (pieceType) {
                case 'p': // Pawn
                    return isValidPawnMove(fromRow, fromCol, toRow, toCol, piece);
                case 'r': // Rook
                    return isValidRookMove(fromRow, fromCol, toRow, toCol);
                case 'n': // Knight
                    return (absRowDiff === 2 && absColDiff === 1) || (absRowDiff === 1 && absColDiff === 2);
                case 'b': // Bishop
                    return isValidBishopMove(fromRow, fromCol, toRow, toCol);
                case 'q': // Queen
                    return isValidRookMove(fromRow, fromCol, toRow, toCol) || isValidBishopMove(fromRow, fromCol, toRow, toCol);
                case 'k': // King
                    return absRowDiff <= 1 && absColDiff <= 1;
                default:
                    return false;
            }
        }

        function isValidPawnMove(fromRow, fromCol, toRow, toCol, piece) {
            const direction = piece === piece.toUpperCase() ? -1 : 1;
            const startRow = piece === piece.toUpperCase() ? 6 : 1;
            const rowDiff = toRow - fromRow;
            const colDiff = Math.abs(toCol - fromCol);
            
            // Move forward one square
            if (colDiff === 0 && rowDiff === direction && !board[toRow][toCol]) {
                return true;
            }
            
            // Move forward two squares from starting position
            if (colDiff === 0 && rowDiff === 2 * direction && fromRow === startRow && 
                !board[toRow][toCol] && !board[fromRow + direction][fromCol]) {
                return true;
            }
            
            // Capture diagonally
            if (colDiff === 1 && rowDiff === direction && board[toRow][toCol]) {
                return true;
            }
            
            return false;
        }

        function isValidRookMove(fromRow, fromCol, toRow, toCol) {
            if (fromRow !== toRow && fromCol !== toCol) return false;
            return isPathClear(fromRow, fromCol, toRow, toCol);
        }

        function isValidBishopMove(fromRow, fromCol, toRow, toCol) {
            if (Math.abs(toRow - fromRow) !== Math.abs(toCol - fromCol)) return false;
            return isPathClear(fromRow, fromCol, toRow, toCol);
        }

        function isPathClear(fromRow, fromCol, toRow, toCol) {
            const rowStep = toRow > fromRow ? 1 : (toRow < fromRow ? -1 : 0);
            const colStep = toCol > fromCol ? 1 : (toCol < fromCol ? -1 : 0);
            
            let currentRow = fromRow + rowStep;
            let currentCol = fromCol + colStep;
            
            while (currentRow !== toRow || currentCol !== toCol) {
                if (board[currentRow][currentCol]) return false;
                currentRow += rowStep;
                currentCol += colStep;
            }
            
            return true;
        }

        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const capturedPiece = board[toRow][toCol];
            
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = '';
            
            // Record move
            const moveNotation = `${pieces[piece]} ${String.fromCharCode(97 + fromCol)}${8 - fromRow} → ${String.fromCharCode(97 + toCol)}${8 - toRow}${capturedPiece ? ' (captures ' + pieces[capturedPiece] + ')' : ''}`;
            moveHistory.push(moveNotation);
            updateMoveHistory();
        }

        function updateMoveHistory() {
            const historyElement = document.getElementById('moveHistory');
            const recentMoves = moveHistory.slice(-10);
            const startIndex = moveHistory.length - recentMoves.length + 1;
            const movesHTML = recentMoves.reverse().map((move, index) => 
                `<p>${moveHistory.length - index}. ${move}</p>`
            ).join('');
            historyElement.innerHTML = '<h3>Move History</h3>' + movesHTML;
        }

        function updateStatus() {
            const statusElement = document.getElementById('status');
            const isInCheck = isKingInCheck();
            
            if (isCheckmate()) {
                const winner = currentTurn === 'white' ? 'Black' : 'White';
                statusElement.textContent = `Checkmate! ${winner} Wins!`;
                statusElement.className = 'status checkmate';
            } else if (isInCheck) {
                statusElement.textContent = `${currentTurn.charAt(0).toUpperCase() + currentTurn.slice(1)}'s Turn - Check!`;
                statusElement.className = 'status check';
            } else {
                statusElement.textContent = `${currentTurn.charAt(0).toUpperCase() + currentTurn.slice(1)}'s Turn`;
                statusElement.className = `status ${currentTurn}-turn`;
            }
        }

        function isKingInCheck() {
            // Find the current player's king
            const kingSymbol = currentTurn === 'white' ? 'K' : 'k';
            let kingRow = -1, kingCol = -1;
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if (board[row][col] === kingSymbol) {
                        kingRow = row;
                        kingCol = col;
                        break;
                    }
                }
                if (kingRow !== -1) break;
            }
            
            // If king is not found, return false (shouldn't happen in normal game)
            if (kingRow === -1) return false;
            
            // Check if any opponent piece can attack the king
            const originalTurn = currentTurn;
            currentTurn = currentTurn === 'white' ? 'black' : 'white';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece && isCurrentPlayerPiece(piece)) {
                        if (isValidMove(row, col, kingRow, kingCol)) {
                            currentTurn = originalTurn;
                            return true;
                        }
                    }
                }
            }
            
            currentTurn = originalTurn;
            return false;
        }

        function isCheckmate() {
            if (!isKingInCheck()) return false;
            
            // Try all possible moves for the current player
            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    const piece = board[fromRow][fromCol];
                    if (piece && isCurrentPlayerPiece(piece)) {
                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (isValidMove(fromRow, fromCol, toRow, toCol)) {
                                    // Try the move
                                    const originalPiece = board[toRow][toCol];
                                    board[toRow][toCol] = piece;
                                    board[fromRow][fromCol] = '';
                                    
                                    const stillInCheck = isKingInCheck();
                                    
                                    // Undo the move
                                    board[fromRow][fromCol] = piece;
                                    board[toRow][toCol] = originalPiece;
                                    
                                    if (!stillInCheck) {
                                        return false;
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            return true;
        }

        function resetGame() {
            board = JSON.parse(JSON.stringify(initialBoard));
            selectedSquare = null;
            currentTurn = 'white';
            moveHistory = [];
            document.getElementById('moveHistory').innerHTML = '<h3>Move History</h3>';
            initBoard();
            updateStatus();
        }

        // Initialize the game
        initBoard();
        updateStatus();
    </script>
</body>
</html>
